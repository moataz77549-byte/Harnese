name: Publish Harnese Nova with original owner certificate
on:
  workflow_dispatch:
    inputs:
      verified_run_id:
        description: Successful Nova offline verification/build run ID
        required: true
      phone_verified:
        description: Owner has verified PRoot, background Telegram and offline APK build on Android
        type: boolean
        default: false
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: harnese-nova-owner-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_RUN: ${{ inputs.verified_run_id }}
      OWNER_PHONE_VERIFIED: ${{ inputs.phone_verified }}
      NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
      NOVA_STORE_PASSWORD: ${{ secrets.NOVA_STORE_PASSWORD }}
      NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
      NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
      EXPECTED_CERT: d7f31fde154fc9b46fe8ef333fd12ecdfbd9b331d71a5284c24a6ad8ad45de51
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require verified build and persistent original signing key
        shell: bash
        run: |
          set -euo pipefail
          test "$OWNER_PHONE_VERIFIED" = true
          test -n "$NOVA_KEYSTORE_BASE64" && test -n "$NOVA_STORE_PASSWORD" && test -n "$NOVA_KEY_PASSWORD" && test -n "$NOVA_KEY_ALIAS"
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .path)" = '.github/workflows/nova-offline-verify.yml'
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name nova-offline-owner-signing --dir owner-signing
      - name: Sign and inspect with official Android tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-owner.p12"
          mkdir -p release
          APK=release/Harnese-Nova-v1.3.2-Offline-ARM64.apk
          java -jar owner-signing/apksigner.jar sign --ks "$RUNNER_TEMP/nova-owner.p12" --ks-key-alias "$NOVA_KEY_ALIAS" --ks-pass env:NOVA_STORE_PASSWORD --key-pass env:NOVA_KEY_PASSWORD --out "$APK" owner-signing/*-unsigned.apk
          java -jar owner-signing/apksigner.jar verify --verbose --print-certs "$APK" > release/certificate.txt
          grep -F "certificate SHA-256 digest: $EXPECTED_CERT" release/certificate.txt
          grep -F "Number of signers: 1" release/certificate.txt
          chmod +x owner-signing/aapt
          LD_LIBRARY_PATH="$PWD/owner-signing/lib64" owner-signing/aapt dump badging "$APK" > release/package.txt
          grep -F "package: name='com.moataz.harnese.nova' versionCode='15' versionName='1.3.2'" release/package.txt
          grep -F "native-code: 'arm64-v8a'" release/package.txt
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('release/Harnese-Nova-v1.3.2-Offline-ARM64.apk')
          artifact={'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/harnese-nova-v1.3.2/{p.name}','sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'sizeBytes':p.stat().st_size}
          pathlib.Path('release/harnese-nova-update.json').write_text(json.dumps({'versionCode':15,'versionName':'1.3.2','notes':'Nova Agent Hub and embedded offline development environments. See release notes for verified capabilities.','artifacts':{'offline':artifact,'online':artifact}},indent=2)+'\n')
          PY
          rm "$RUNNER_TEMP/nova-owner.p12"
      - name: Publish direct APK, checksums and update manifest
        shell: bash
        run: |
          set -euo pipefail
          if gh release view harnese-nova-v1.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace signed assets.'
            exit 1
          fi
          gh release create harnese-nova-v1.3.2 release/*.apk release/SHA256SUMS.txt release/harnese-nova-update.json release/certificate.txt release/package.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Harnese Nova 1.3.2 — Offline Development Edition' --notes-file docs/NOVA_NEXT_STATUS_AR.md
      - name: Remove signing material after any failure
        if: always()
        run: rm -f "$RUNNER_TEMP/nova-owner.p12"
