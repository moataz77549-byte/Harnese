name: Nova RC4 Android 8+ installation gate
on:
  push:
    branches: [fix/nova-rc4-install-compat]
  workflow_dispatch:
    inputs:
      run_device_matrix:
        description: Run on dedicated disposable ARM64 Android test devices
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[nova-rc4-signed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Check original owner signing availability
        env:
          HARN_NOVA_JKS_B64: ${{ secrets.HARN_NOVA_JKS_B64 }}
          HARN_NOVA_KEYSTORE_PASS: ${{ secrets.HARN_NOVA_KEYSTORE_PASS }}
          HARN_NOVA_KEY_ALIAS: ${{ secrets.HARN_NOVA_KEY_ALIAS }}
          HARN_NOVA_KEY_PASS: ${{ secrets.HARN_NOVA_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HARN_NOVA_JKS_B64 HARN_NOVA_KEYSTORE_PASS HARN_NOVA_KEY_ALIAS HARN_NOVA_KEY_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "Owner signing configuration unavailable; APK must not be published."
              exit 0
            fi
          done
          echo "Owner signing configuration present; certificate still requires verification."
      - name: Build standalone ARM64 and unit tests
        run: ./gradlew :app:testOnlineDebugUnitTest :app:assembleOnlineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Check APK structure and native binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          mapfile -t apks < <(find app/build/outputs/apk/online/release -name '*.apk')
          test "${#apks[@]}" -eq 1
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f -P 16 4 "${apks[0]}" delivery/nova-rc4-unsigned.apk
          APK=delivery/nova-rc4-unsigned.apk
          "$BT/aapt2" dump badging "$APK" > delivery/package.txt
          grep -F "package: name='com.moataz.harnese.nova' versionCode='23' versionName='2.0.0-rc.4'" delivery/package.txt
          grep -E "^(minSdkVersion|sdkVersion):'26'$" delivery/package.txt
          grep -F "native-code: 'arm64-v8a'" delivery/package.txt
          ! grep -E "^package:.*split=" delivery/package.txt
          unzip -t "$APK" > delivery/apk-integrity.txt
          python3 scripts/release/check_zstd_jni.py "$APK" > delivery/zstd-jni-check.txt
          python3 - "$APK" <<'PY'
          import sys, zipfile, struct
          with zipfile.ZipFile(sys.argv[1]) as z, open('delivery/native-audit.txt','w') as report:
              libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
              for n in libs:
                  data=z.read(n)
                  assert data[:4]==b'\x7fELF' and data[4:6]==b'\x02\x01', n
                  assert struct.unpack_from('<H',data,18)[0]==183, n
                  phoff=struct.unpack_from('<Q',data,32)[0]
                  entsize,num=struct.unpack_from('<HH',data,54)
                  for i in range(num):
                      ph=struct.unpack_from('<IIQQQQQQ',data,phoff+i*entsize)
                      if ph[0]==1:
                          assert ph[7]>=4096 and ph[2]%ph[7]==ph[3]%ph[7], n
                  report.write(n+' AArch64 ELF; ZIP compression='+str(z.getinfo(n).compress_type)+'\n')
              assert 'assets/engine/codex-arm64.bundle' not in z.namelist()
          PY
          cp "$BT/lib/apksigner.jar" delivery/apksigner.jar
          (cd delivery && sha256sum nova-rc4-unsigned.apk apksigner.jar > UNSIGNED-SHA256SUMS.txt)
      - name: Run full lint and retain its report
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintOnlineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Reject any new lint errors (including Android API compatibility)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/check_rc4_lint_regressions.py app/build/reports/lint-results-onlineRelease.xml scripts/release/nova_rc4_known_lint.json | tee delivery/lint-regressions.txt
      - name: Upload verified unsigned APK for local owner signing
        uses: actions/upload-artifact@v4
        with:
          name: nova-rc4-unsigned-arm64
          path: |
            delivery/nova-rc4-unsigned.apk
            delivery/apksigner.jar
            delivery/UNSIGNED-SHA256SUMS.txt
            delivery/package.txt
            delivery/native-audit.txt
            delivery/apk-integrity.txt
            delivery/zstd-jni-check.txt
            delivery/lint-regressions.txt
            app/build/reports/lint-results-onlineRelease.xml
            app/build/test-results/testOnlineDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-rc4-verification-evidence
          path: |
            app/build/test-results/testOnlineDebugUnitTest/
            app/build/reports/lint-results-onlineRelease.xml
            delivery/package.txt
            delivery/native-audit.txt
            delivery/apk-integrity.txt
            delivery/zstd-jni-check.txt
          if-no-files-found: warn
      - name: Sign using original owner certificate only
        id: sign
        env:
          HARN_NOVA_JKS_B64: ${{ secrets.HARN_NOVA_JKS_B64 }}
          HARN_NOVA_KEYSTORE_PASS: ${{ secrets.HARN_NOVA_KEYSTORE_PASS }}
          HARN_NOVA_KEY_ALIAS: ${{ secrets.HARN_NOVA_KEY_ALIAS }}
          HARN_NOVA_KEY_PASS: ${{ secrets.HARN_NOVA_KEY_PASS }}
        shell: bash
        run: |
          set -euo pipefail
          for name in HARN_NOVA_JKS_B64 HARN_NOVA_KEYSTORE_PASS HARN_NOVA_KEY_ALIAS HARN_NOVA_KEY_PASS; do
            if [[ -z "${!name}" ]]; then
              echo "signed=false" >> "$GITHUB_OUTPUT"
              echo "Owner key unavailable; unsigned candidate only. Do not install or publish." > delivery/signing-status.txt
              exit 0
            fi
          done
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          KS=$(mktemp)
          trap 'rm -f "$KS"' EXIT
          chmod 600 "$KS"
          printf '%s' "$HARN_NOVA_JKS_B64" | base64 -d > "$KS"
          APK=delivery/Harnese-Nova-2.0.0-rc.4-Android8Plus-ARM64.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$HARN_NOVA_KEY_ALIAS" --ks-pass env:HARN_NOVA_KEYSTORE_PASS --key-pass env:HARN_NOVA_KEY_PASS --min-sdk-version 26 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$APK" delivery/nova-rc4-unsigned.apk
          "$BT/apksigner" verify --verbose --print-certs --min-sdk-version 26 "$APK" > delivery/certificate.txt
          grep -F "certificate SHA-256 digest: d7f31fde154fc9b46fe8ef333fd12ecdfbd9b331d71a5284c24a6ad8ad45de51" delivery/certificate.txt
          grep -F "Number of signers: 1" delivery/certificate.txt
          # Verify each scheme in the platform range where Android actually uses it.
          # A verifier restricted to API 26+ may skip checking v1 even if present.
          for entry in v1:23 v2:26 v3:28; do
            scheme=${entry%:*}
            api=${entry#*:}
            "$BT/apksigner" verify --verbose --print-certs --min-sdk-version "$api" --max-sdk-version "$api" "$APK" > "delivery/certificate-$scheme.txt"
            grep -E "Verified using $scheme scheme .*: true" "delivery/certificate-$scheme.txt"
            grep -F "certificate SHA-256 digest: d7f31fde154fc9b46fe8ef333fd12ecdfbd9b331d71a5284c24a6ad8ad45de51" "delivery/certificate-$scheme.txt"
          done
          "$BT/zipalign" -c -P 16 4 "$APK"
          "$BT/aapt2" dump badging "$APK" > delivery/package.txt
          rm -f delivery/nova-rc4-unsigned.apk
          (cd delivery && zip -q Harnese-Nova-2.0.0-rc.4-Android8Plus-ARM64.zip *.apk && sha256sum *.apk *.zip > SHA256SUMS.txt)
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nova-rc4-candidate-NOT-RELEASED
          path: delivery/
          if-no-files-found: error
  device:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_device_matrix && needs.build.outputs.signed == 'true' }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        api: [26, 27, 28, 29, 30, 31, 33, 34, 35, 36]
    runs-on: [self-hosted, android-arm64-test, "api-${{ matrix.api }}"]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nova-rc4-candidate-NOT-RELEASED
          path: delivery
      - name: Verify fresh install and supported upgrade
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          bash scripts/release/test_rc4_device.sh "${{ matrix.api }}" delivery/Harnese-Nova-2.0.0-rc.4-Android8Plus-ARM64.apk 2>&1 | tee reports/api-${{ matrix.api }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-rc4-device-api-${{ matrix.api }}
          path: reports/
