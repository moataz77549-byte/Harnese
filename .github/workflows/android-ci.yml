name: Build Harnese Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  online-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the ARM64 online APK
        run: ./gradlew :app:testOnlineDebugUnitTest :app:assembleOnlineDebug --no-daemon --stacktrace
      - name: Publish APK build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harnese-online-debug-arm64
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 14
