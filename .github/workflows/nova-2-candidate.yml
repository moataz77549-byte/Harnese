name: Nova 2 ARM64 candidate and verified owner release

on:
  push:
    branches: [feat/harnese-nova-2]
    paths: ['app/**', 'scripts/release/**', '.github/workflows/nova-2-candidate.yml', 'scripts/runtime-bundles/**', 'nova-2-rc3-signature.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: nova-2-candidate
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[nova2-rc3-signature]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build SDK-free ARM64 candidate and test
        run: ./gradlew :app:testOnlineDebugUnitTest :app:assembleOnlineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Inspect candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          APK=$(find app/build/outputs/apk/online/release -name '*.apk' -print -quit)
          test -s "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f -P 16 4 "$APK" delivery/nova-2-unsigned.apk
          APK=delivery/nova-2-unsigned.apk
          "$BT/aapt" dump badging "$APK" > delivery/package.txt
          grep -F "package: name='com.moataz.harnese.nova' versionCode='22' versionName='2.0.0-rc.3'" delivery/package.txt
          grep -F "sdkVersion:'28'" delivery/package.txt
          grep -F "native-code: 'arm64-v8a'" delivery/package.txt
          unzip -t "$APK" > delivery/apk-integrity.txt
          python3 scripts/release/check_zstd_jni.py "$APK" | tee delivery/zstd-jni-check.txt
          python3 - "$APK" <<'PY'
          import sys,zipfile,hashlib
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert all(not v.startswith('assets/runtime/') for v in z.namelist()), 'Unexpected bundled runtime in online APK'
              assert 'assets/engine/codex-arm64.bundle' not in z.namelist(), 'Codex must download during setup'
              assert all(not (v.startswith('assets/') and z.getinfo(v).file_size > 20 * 1024 * 1024) for v in z.namelist()), 'Unexpected large bundled asset'
              assert 'assets/licenses/Codex-LICENSE.txt' in z.namelist()
          PY
          (cd delivery && sha256sum nova-2-unsigned.apk > SHA256SUMS.txt)
          cp -r app/build/test-results/testOnlineDebugUnitTest delivery/unit-tests
          cp "$BT/lib/apksigner.jar" delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: nova-2-unsigned-arm64
          path: delivery
          if-no-files-found: error
          retention-days: 14
  publish:
    if: ${{ contains(github.event.head_commit.message, '[nova2-rc3-signature]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT: d7f31fde154fc9b46fe8ef333fd12ecdfbd9b331d71a5284c24a6ad8ad45de51
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Match signature to successful build
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(jq -r .sourceCommit nova-2-rc3-signature.json)
          RUN=$(jq -r .verifiedRunId nova-2-rc3-signature.json)
          [[ "$SOURCE" =~ ^[a-f0-9]{40}$ && "$RUN" =~ ^[0-9]+$ ]]
          test "$(git diff --name-only "$SOURCE" "$GITHUB_SHA")" = nova-2-rc3-signature.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .head_sha)" = "$SOURCE"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .path)" = '.github/workflows/nova-2-candidate.yml'
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name nova-2-unsigned-arm64 --dir unsigned
          mkdir -p delivery
          APK=delivery/Harnese-Nova-2.0.0-rc.3-Android9Plus-ARM64.apk
          python3 scripts/release/apk_signature_patch.py apply unsigned/nova-2-unsigned.apk nova-2-rc3-signature.json "$APK"
          java -jar unsigned/apksigner.jar verify --verbose --print-certs "$APK" > delivery/certificate.txt
          grep -F "certificate SHA-256 digest: $EXPECTED_CERT" delivery/certificate.txt
          grep -F "Number of signers: 1" delivery/certificate.txt
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -c -P 16 4 "$APK"
          "$BT/aapt" dump badging "$APK" > delivery/package.txt
          grep -F "package: name='com.moataz.harnese.nova' versionCode='22' versionName='2.0.0-rc.3'" delivery/package.txt
          grep -F "sdkVersion:'28'" delivery/package.txt
          grep -F "native-code: 'arm64-v8a'" delivery/package.txt
          python3 scripts/release/check_zstd_jni.py "$APK" > delivery/zstd-jni-check.txt
          (cd delivery && sha256sum *.apk > SHA256SUMS.txt)
          mkdir -p source-package/Harnese-Nova-2.0
          git archive "$SOURCE" | tar -xf - -C source-package/Harnese-Nova-2.0
          for submodule in third_party/proot third_party/libandroid-shmem; do
            mkdir -p "source-package/Harnese-Nova-2.0/$submodule"
            git -C "$submodule" archive HEAD | tar -xf - -C "source-package/Harnese-Nova-2.0/$submodule"
          done
          (cd source-package && zip -qr ../delivery/Harnese-Nova-2.0-Source.zip Harnese-Nova-2.0)
          (cd delivery && sha256sum *.apk *.zip > SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('delivery/Harnese-Nova-2.0.0-rc.3-Android9Plus-ARM64.apk')
          a={'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/harnese-nova-v2.0.0-rc.3/{p.name}','sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'sizeBytes':p.stat().st_size}
          pathlib.Path('delivery/harnese-nova-update.json').write_text(json.dumps({'versionCode':22,'versionName':'2.0.0-rc.3','notes':'Official Codex CLI downloads automatically during first-run setup. Smaller APK; existing Codex and projects preserved.','artifacts':{'online':a,'offline':a}},indent=2)+'\n')
          PY
      - name: Publish signed prerelease
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=$(jq -r .sourceCommit nova-2-rc3-signature.json)
          gh release create harnese-nova-v2.0.0-rc.3 delivery/*.apk delivery/*.zip delivery/*.txt delivery/harnese-nova-update.json --repo "$GITHUB_REPOSITORY" --target "$SOURCE" --title 'Harnese Nova 2.0.0 RC3 – ARM64 Android 9+' --notes-file docs/RELEASE_NOTES.md --prerelease
