name: Build Nova Light Android 10 ARM64
on:
  push:
    branches: [feat/nova-telegram-agent-hub]
    paths: ['app/**', 'scripts/offline/**', '.github/workflows/nova-light-build.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare embedded core Python and TypeScript
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          python3 scripts/offline/prepare-bundles.py
      - name: Test and build
        run: ./gradlew :app:testOfflineDebugUnitTest :app:assembleOfflineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Align and inspect
        run: |
          mkdir delivery
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" delivery/
          cp "$BT/aapt" "$BT/zipalign" delivery/
          cp -a "$BT/lib64" delivery/
          APK=$(find app/build/outputs/apk/offline/release -name '*unsigned.apk' -print -quit)
          "$BT/zipalign" -P 16 -f 4 "$APK" delivery/unsigned.apk
          "$BT/aapt" dump badging delivery/unsigned.apk > delivery/package.txt
          grep "sdkVersion:'29'" delivery/package.txt
          grep "native-code: 'arm64-v8a'" delivery/package.txt
          test "$(stat -c %s delivery/unsigned.apk)" -lt 150000000
          cp dist/runtime-bundles/offline-measured-manifest.json delivery/
      - uses: actions/upload-artifact@v4
        with:
          name: nova-light-unsigned
          path: delivery
          compression-level: 0
