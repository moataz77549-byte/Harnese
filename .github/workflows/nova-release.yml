name: Publish locally owner-signed Harnese Nova APK
on:
  push:
    branches: [feat/nova-telegram-agent-hub]
    paths: ['release-candidate.json']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: harnese-nova-owner-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_CERT: d7f31fde154fc9b46fe8ef333fd12ecdfbd9b331d71a5284c24a6ad8ad45de51
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require matching source and successful real offline verification
        shell: bash
        run: |
          set -euo pipefail
          test -s release-candidate.json
          SOURCE_SHA=$(jq -r .sourceCommit release-candidate.json)
          VERIFIED_RUN=$(jq -r .verifiedRunId release-candidate.json)
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERIFIED_RUN" =~ ^[0-9]+$ ]]
          # A release delivery may change only the public signature patch after its verified source.
          test "$(git diff --name-only "$SOURCE_SHA" "$GITHUB_SHA")" = release-candidate.json
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .conclusion)" = success
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN" --jq .path)" = '.github/workflows/nova-offline-verify.yml'
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" --name nova-offline-owner-signing --dir owner-signing
      - name: Reconstruct public signature and inspect with official Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          APK=release/Harnese-Nova-v1.3.2-Offline-ARM64.apk
          BASE=$(find owner-signing -maxdepth 1 -name '*-unsigned.apk' -print -quit)
          test -n "$BASE"
          python3 scripts/release/apk_signature_patch.py apply "$BASE" release-candidate.json "$APK"
          java -jar owner-signing/apksigner.jar verify --verbose --print-certs "$APK" > release/certificate.txt
          grep -F "certificate SHA-256 digest: $EXPECTED_CERT" release/certificate.txt
          grep -F "Number of signers: 1" release/certificate.txt
          chmod +x owner-signing/aapt owner-signing/zipalign
          LD_LIBRARY_PATH="$PWD/owner-signing/lib64" owner-signing/zipalign -c -P 16 4 "$APK"
          LD_LIBRARY_PATH="$PWD/owner-signing/lib64" owner-signing/aapt dump badging "$APK" > release/package.txt
          grep -F "package: name='com.moataz.harnese.nova' versionCode='15' versionName='1.3.2'" release/package.txt
          grep -F "native-code: 'arm64-v8a'" release/package.txt
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import hashlib,json,pathlib,os
          p=pathlib.Path('release/Harnese-Nova-v1.3.2-Offline-ARM64.apk')
          artifact={'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/harnese-nova-v1.3.2/{p.name}','sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'sizeBytes':p.stat().st_size}
          pathlib.Path('release/harnese-nova-update.json').write_text(json.dumps({'versionCode':15,'versionName':'1.3.2','notes':'Nova Agent Hub and embedded offline development environments. See release notes for tested capabilities and device/account test limits.','artifacts':{'offline':artifact,'online':artifact}},indent=2)+'\n')
          PY
      - name: Publish direct signed APK, checksums and update manifest
        shell: bash
        run: |
          set -euo pipefail
          if gh release view harnese-nova-v1.3.2 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace signed assets.'
            exit 1
          fi
          SOURCE_SHA=$(jq -r .sourceCommit release-candidate.json)
          gh release create harnese-nova-v1.3.2 release/*.apk release/SHA256SUMS.txt release/harnese-nova-update.json release/certificate.txt release/package.txt --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title 'Harnese Nova 1.3.2 — Offline Development Edition' --notes-file docs/NOVA_NEXT_STATUS_AR.md
