name: Publish owner signed Nova Light 1.3.3
on:
  push:
    branches: [ops/nova-owner-signing-transport]
    paths: ['nova-light-candidate.json']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source build and reconstruct signed APK
        run: |
          set -euo pipefail
          RUN=$(jq -r .verifiedRunId nova-light-candidate.json)
          SOURCE=$(jq -r .sourceCommit nova-light-candidate.json)
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$RUN --jq .conclusion)" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$RUN --jq .head_sha)" = "$SOURCE"
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/$RUN --jq .path)" = .github/workflows/nova-light-build.yml
          gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name nova-light-unsigned --dir delivery
          mkdir release
          APK=release/Harnese-Nova-v1.3.3-Light-ARM64.apk
          python3 scripts/release/apk_signature_patch.py apply delivery/unsigned.apk nova-light-candidate.json "$APK"
          java -jar delivery/apksigner.jar verify --verbose --print-certs "$APK" > release/certificate.txt
          grep 'certificate SHA-256 digest: d7f31fde154fc9b46fe8ef333fd12ecdfbd9b331d71a5284c24a6ad8ad45de51' release/certificate.txt
          chmod +x delivery/aapt delivery/zipalign
          export LD_LIBRARY_PATH="$PWD/delivery/lib64"
          delivery/zipalign -c -P 16 4 "$APK"
          delivery/aapt dump badging "$APK" > release/package.txt
          grep "package: name='com.moataz.harnese.nova' versionCode='16' versionName='1.3.3'" release/package.txt
          grep "sdkVersion:'29'" release/package.txt
          grep "native-code: 'arm64-v8a'" release/package.txt
          test "$(stat -c %s "$APK")" -lt 150000000
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          python3 - <<'PY'
          import pathlib,json,hashlib,os
          p=pathlib.Path('release/Harnese-Nova-v1.3.3-Light-ARM64.apk')
          item={'url':f'https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/harnese-nova-v1.3.3/{p.name}','sha256':hashlib.file_digest(p.open('rb'),'sha256').hexdigest(),'sizeBytes':p.stat().st_size}
          pathlib.Path('release/harnese-nova-update.json').write_text(json.dumps({'versionCode':16,'versionName':'1.3.3','notes':'Light ARM64 edition for Android 10+. Core, Python and TypeScript embedded. Android tools and agents download on request. Actual installed Antigravity version detection.','artifacts':{'online':item,'offline':item}},indent=2))
          PY
      - name: Publish direct APK
        run: |
          gh release create harnese-nova-v1.3.3 release/* --repo "$GITHUB_REPOSITORY" --target "$(jq -r .sourceCommit nova-light-candidate.json)" --title "Harnese Nova 1.3.3 Light — Android 10+ ARM64" --notes "Python, Node.js, npm and TypeScript are embedded. Android SDK/JDK/Gradle and coding agents download on request. Initial setup no longer installs every toolchain and the default agent. Antigravity update checks read the actual CLI version before comparing with the official release. Signed with the original Nova certificate. Unit tests, Release build, package identity, ARM64, API 29 minimum and APK alignment verified. Physical-device startup and account-specific model availability still require device testing."
