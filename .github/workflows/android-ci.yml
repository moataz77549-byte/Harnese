name: Build Harnese Android APK

on:
  push:
    branches: [main, feat/nova-telegram-agent-hub]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nova-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  online-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build the ARM64 online APK
        run: ./gradlew :app:testOnlineDebugUnitTest :app:assembleOnlineDebug --no-daemon --stacktrace
      - name: Publish APK build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harnese-online-debug-arm64
          path: app/build/outputs/apk/online/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build Harnese Nova unsigned release (requires owner signing)
        run: ./gradlew :app:assembleOnlineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Verify Nova package identity and launcher label
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/online/release -name '*-unsigned.apk' -print -quit)
          test -n "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/harnese-nova-badging.txt"
          grep -F "package: name='com.moataz.harnese.nova'" "$RUNNER_TEMP/harnese-nova-badging.txt"
          grep -F "application-label:'Harnese Nova'" "$RUNNER_TEMP/harnese-nova-badging.txt"
      - name: Verify Nova package identity and publish unsigned release
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: harnese-nova-unsigned-release-arm64
          path: app/build/outputs/apk/online/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Preserve official signing and package-inspection tools
        run: |
          mkdir -p owner-signing-tools
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          cp "$BUILD_TOOLS/lib/apksigner.jar" "$BUILD_TOOLS/aapt" owner-signing-tools/
          cp -a "$BUILD_TOOLS/lib64" owner-signing-tools/
          find owner-signing-tools -type f ! -name SHA256.txt ! -name BUILD-SHA256.txt -print0 | sort -z | xargs -0 sha256sum > owner-signing-tools/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nova-owner-signing-tools
          path: owner-signing-tools
          retention-days: 7
