name: Nova 2.3.1 Android 8+ installation gate
on:
  push:
    branches: [feat/nova-2.3.1-stability]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[nova-231-signed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone ARM64 and unit tests
        env:
          NOVA_SAMPLE_PROJECT: ${{ runner.temp }}/nova23-template
        run: ./gradlew --no-build-cache :app:testOnlineDebugUnitTest :app:assembleOnlineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Build and verify a project generated by the app
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew -p "$RUNNER_TEMP/nova23-template" :app:assembleDebug --no-daemon --stacktrace
          SAMPLE="$RUNNER_TEMP/nova23-template/app/build/outputs/apk/debug/app-debug.apk"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify "$SAMPLE"
          "$BT/aapt2" dump badging "$SAMPLE" > "$RUNNER_TEMP/sample-badging.txt"
          grep -F "package: name='com.pocketdev.views_demo'" "$RUNNER_TEMP/sample-badging.txt"
      - name: Check APK structure and native binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery
          mapfile -t apks < <(find app/build/outputs/apk/online/release -name '*.apk')
          test "${#apks[@]}" -eq 1
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/zipalign" -f -P 16 4 "${apks[0]}" delivery/nova-231-unsigned.apk
          APK=delivery/nova-231-unsigned.apk
          "$BT/aapt2" dump badging "$APK" > delivery/package.txt
          grep -F "package: name='com.moataz.harnese.nova' versionCode='28' versionName='2.3.1'" delivery/package.txt
          grep -E "^(minSdkVersion|sdkVersion):'26'$" delivery/package.txt
          grep -F "native-code: 'arm64-v8a'" delivery/package.txt
          ! grep -E "^package:.*split=" delivery/package.txt
          unzip -t "$APK" > delivery/apk-integrity.txt
          python3 scripts/release/check_zstd_jni.py "$APK" > delivery/zstd-jni-check.txt
          python3 - "$APK" <<'PY'
          import sys, zipfile, struct
          with zipfile.ZipFile(sys.argv[1]) as z, open('delivery/native-audit.txt','w') as report:
              libs=[n for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libs and all(n.startswith('lib/arm64-v8a/') for n in libs)
              for n in libs:
                  data=z.read(n)
                  assert data[:4]==b'\x7fELF' and data[4:6]==b'\x02\x01', n
                  assert struct.unpack_from('<H',data,18)[0]==183, n
                  phoff=struct.unpack_from('<Q',data,32)[0]
                  entsize,num=struct.unpack_from('<HH',data,54)
                  for i in range(num):
                      ph=struct.unpack_from('<IIQQQQQQ',data,phoff+i*entsize)
                      if ph[0]==1:
                          assert ph[7]>=4096 and ph[2]%ph[7]==ph[3]%ph[7], n
                  report.write(n+' AArch64 ELF; ZIP compression='+str(z.getinfo(n).compress_type)+'\n')
              assert 'assets/engine/codex-arm64.bundle' not in z.namelist()
          PY
          cp "$BT/lib/apksigner.jar" delivery/apksigner.jar
          (cd delivery && sha256sum nova-231-unsigned.apk apksigner.jar > UNSIGNED-SHA256SUMS.txt)
      - name: Run full lint and retain its report
        id: lint
        continue-on-error: true
        run: ./gradlew :app:lintOnlineRelease -PmhParallelInstall=true --no-daemon --stacktrace
      - name: Reject any new lint errors (including Android API compatibility)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/check_rc4_lint_regressions.py app/build/reports/lint-results-onlineRelease.xml scripts/release/nova_rc4_known_lint.json | tee delivery/lint-regressions.txt
      - name: Upload verified unsigned APK for local owner signing
        uses: actions/upload-artifact@v4
        with:
          name: nova-231-unsigned-arm64
          path: |
            delivery/nova-231-unsigned.apk
            delivery/apksigner.jar
            delivery/UNSIGNED-SHA256SUMS.txt
            delivery/package.txt
            delivery/native-audit.txt
            delivery/apk-integrity.txt
            delivery/zstd-jni-check.txt
            delivery/lint-regressions.txt
            app/build/reports/lint-results-onlineRelease.xml
            app/build/test-results/testOnlineDebugUnitTest/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve build and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-231-verification-evidence
          path: |
            app/build/test-results/testOnlineDebugUnitTest/
            app/build/reports/lint-results-onlineRelease.xml
            delivery/package.txt
            delivery/native-audit.txt
            delivery/apk-integrity.txt
            delivery/zstd-jni-check.txt
          if-no-files-found: warn
  publish-owner-signed:
    needs: build
    if: ${{ github.ref == 'refs/heads/feat/nova-2.3.1-stability' && !contains(github.event.head_commit.message, '[nova-231-signed]') }}
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/nova-231-publish.yml
    with:
      direct_sign: true
    secrets:
      HARN_NOVA_JKS_B64: ${{ secrets.HARN_NOVA_JKS_B64 }}
      HARN_NOVA_KEYSTORE_PASS: ${{ secrets.HARN_NOVA_KEYSTORE_PASS }}
      HARN_NOVA_KEY_ALIAS: ${{ secrets.HARN_NOVA_KEY_ALIAS }}
      HARN_NOVA_KEY_PASS: ${{ secrets.HARN_NOVA_KEY_PASS }}
